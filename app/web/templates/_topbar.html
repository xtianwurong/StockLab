{#
  顶部工具条 (app/web/templates/_topbar.html)

  只放「跨页面都常用」的三件事：全局证券搜索（回车进个股页）、
  侧边栏折叠、主题切换。页面级筛选一律留在页面内部，不上浮到顶栏——
  顶栏是外壳的一部分，混进业务筛选会让人分不清哪些是全局的。
#}
<header class="topbar">
  <button class="btn btn-ghost btn-icon btn-sm" id="btn-collapse" type="button"
          aria-label="折叠/展开导航" title="折叠/展开导航（快捷键 [）">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>

  <div class="topbar-search">
    <span class="topbar-search-icon">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20l-3.5-3.5"></path>
      </svg>
    </span>
    <input class="input" id="global-search" type="text" autocomplete="off" list="none"
           placeholder="搜股票：代码或中文名，回车直达个股页（快捷键 /）"
           aria-label="全局证券搜索">
    <div class="suggest" id="global-suggest"></div>
  </div>

  <div class="topbar-spacer"></div>

  <div class="topbar-meta">
    <span class="nowrap">口径 <b>亏损期已剔除</b></span>
  </div>

  <button class="theme-toggle" type="button" data-theme-toggle
          aria-label="切换主题" title="切换主题（快捷键 T）">
    <span class="icon-sun" aria-hidden="true">☀</span>
    <span class="icon-moon" aria-hidden="true">☾</span>
  </button>
</header>
