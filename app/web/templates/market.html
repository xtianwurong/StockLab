<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockLab - 全市场估值分位</title>
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/base.css">
  <script src="/static/echarts.min.js"></script>
  <style>
    /* ---------- 工具条 ---------- */
    .toolbar {
      display: flex;
      align-items: flex-end;
      gap: 14px;
      flex-wrap: wrap;
    }
    .toolbar .field { width: 220px; }
    .toolbar .field-wide { width: 260px; }
    .toolbar-spacer { flex: 1; }

    /* ---------- 统计卡 ---------- */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(178px, 1fr));
      gap: 12px;
    }
    .stat-card {
      padding: 13px 15px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .stat-k { font-size: 12px; color: var(--text-muted); }
    .stat-v { font-size: 26px; font-weight: 700; font-family: var(--mono); line-height: 1.2; margin-top: 4px; }
    .stat-sub { font-size: 11.5px; color: var(--text-faint); margin-top: 3px; }

    /* ---------- 分布区 ---------- */
    .dist-grid {
      display: grid;
      grid-template-columns: minmax(320px, 1.7fr) minmax(260px, 1fr);
      gap: 16px;
    }
    #dist-chart { width: 100%; height: 236px; }

    .level-list { display: flex; flex-direction: column; gap: 9px; }
    .level-row { display: grid; grid-template-columns: 74px 1fr 54px; align-items: center; gap: 9px; }
    .level-name { font-size: 12.5px; font-weight: 600; }
    .level-bar { height: 9px; border-radius: 999px; background: var(--bg-hover); overflow: hidden; }
    .level-fill { height: 100%; border-radius: 999px; }
    .level-count { font-size: 12px; color: var(--text-muted); text-align: right; font-family: var(--mono); }
    button.level-row {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 5px 7px;
      margin: -5px -7px;
      border-radius: 7px;
      font: inherit;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s, border-color 0.12s;
    }
    button.level-row:hover { background: var(--bg-hover); border-color: var(--border-color); }
    button.level-row.level-active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .level-clear {
      grid-template-columns: 1fr;
      font-size: 12.5px;
      color: var(--accent);
      font-weight: 600;
      justify-content: center;
    }

    /* ---------- 排行表 ---------- */
    .rank { font-family: var(--mono); color: var(--text-faint); font-size: 12px; width: 34px; }
    .stock-cell { display: flex; align-items: baseline; gap: 8px; }
    .stock-name { font-weight: 600; }
    .stock-code { font-family: var(--mono); font-size: 11.5px; color: var(--text-faint); }
    .mini-temp { width: 96px; }
    .mini-temp .tempbar-track { height: 6px; }
    .mini-temp .tempbar-thumb { height: 12px; width: 2.5px; }
    .mini-temp .tempbar-scale { display: none; }

    .filters-empty { padding: 6px 0; font-size: 12.5px; color: var(--text-faint); }

    @media (max-width: 900px) {
      .dist-grid { grid-template-columns: 1fr; }
      .toolbar .field, .toolbar .field-wide { width: 100%; }
    }
  </style>
</head>
<body>
  {% set active_page = "market" %}
  {% include "_topbar.html" %}

  <main class="container">
    <div class="page-head">
      <div class="page-title">全市场估值分位</div>
      <div class="page-desc">
        每只股票的当前估值在其自身历史中的<span class="term" data-tip="分位 = 历史有效样本中严格小于当前值的条数占比；亏损期样本剔除，分位不可用时显示「-」。">百分位</span>，
        分位越低代表相对自身历史越便宜。点击任意行进入该股的详细分析。
      </div>
    </div>

    <!-- 工具条 -->
    <section class="card card-pad">
      <div class="toolbar">
        <div class="field">
          <label class="field-label">估值指标</label>
          <div class="tabs" id="indicator-tabs"></div>
        </div>
        <div class="field">
          <label class="field-label" for="market-filter">市场</label>
          <select class="select" id="market-filter">
            <option value="">全部市场</option>
            <option value="SH">上交所 SH</option>
            <option value="SZ">深交所 SZ</option>
            <option value="BJ">北交所 BJ</option>
          </select>
        </div>
        <div class="field field-wide">
          <label class="field-label" for="search-input">搜索</label>
          <input class="input" id="search-input" type="text" placeholder="按代码或名称过滤，如 600519 / 茅台">
        </div>
        <div class="field">
          <label class="field-label" for="sort-select">排序</label>
          <select class="select" id="sort-select">
            <option value="percentile:asc">分位从低到高</option>
            <option value="percentile:desc">分位从高到低</option>
            <option value="current_value:asc">当前值从小到大</option>
            <option value="current_value:desc">当前值从大到小</option>
            <option value="sample_count:desc">样本数从多到少</option>
          </select>
        </div>
        <div class="toolbar-spacer"></div>
        <button class="btn btn-primary" id="btn-reload">查询</button>
      </div>
      <div class="filters-empty" id="result-hint"></div>
    </section>

    <div class="message" id="message" style="margin-top:14px"></div>

    <!-- 统计卡 -->
    <section class="stat-grid section" id="stat-grid">
      <div class="stat-card"><div class="stat-k">统计标的</div><div class="stat-v">-</div></div>
      <div class="stat-card"><div class="stat-k">分位可用</div><div class="stat-v">-</div></div>
      <div class="stat-card"><div class="stat-k">分位中位数</div><div class="stat-v">-</div></div>
      <div class="stat-card"><div class="stat-k">低估（&lt;30%）</div><div class="stat-v">-</div></div>
    </section>

    <!-- 分布 -->
    <section class="dist-grid section">
      <div class="card">
        <div class="card-head">
          <div class="card-title">分位分布</div>
          <div class="card-hint" id="hist-hint">按 10% 分档统计标的数量，柱色对应下方七档评级</div>
        </div>
        <div class="card-pad">
          <div id="dist-chart"></div>
          <div class="meta-strip" style="margin-top:6px">
            <span id="market-legend"></span>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">七档评级分布</div>
          <div class="card-hint">点击任一档可只看该档标的</div>
        </div>
        <div class="card-pad"><div class="level-list" id="level-list"></div></div>
      </div>
    </section>

    <!-- 排行表 -->
    <section class="card section">
      <div class="card-head">
        <div class="card-title">估值排行</div>
        <div class="card-hint" id="table-hint">-</div>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th>#</th>
              <th>标的</th>
              <th>市场</th>
              <th class="ta-r">当前值</th>
              <th class="ta-r">分位</th>
              <th class="ta-c">评级</th>
              <th>温度</th>
              <th class="ta-r">中位数</th>
              <th class="ta-r">样本</th>
            </tr>
          </thead>
          <tbody id="rank-body"></tbody>
        </table>
      </div>
      <div class="pager">
        <span id="pager-info">-</span>
        <div class="pager-actions">
          <button class="btn btn-sm" id="btn-prev">上一页</button>
          <button class="btn btn-sm" id="btn-next">下一页</button>
        </div>
      </div>
    </section>
  </main>

  {% include "_footer.html" %}

  <script src="/static/common.js"></script>
  <script src="/static/market.js"></script>
</body>
</html>
