# ==============================================================================
# StockLab - 核心配置文件 (config.toml)
# ------------------------------------------------------------------------------
# 单一应用配置入口，含四类：运行参数 / 取数优先级 / 大盘基准 / 板块 ETF 清单。
# 语法为 TOML（Python 3.11+ 标准库 tomllib 解析），要点：
#   - 注释用 #（TOML 不支持 ; 注释）
#   - 停用某个板块：把对应的 [[sectors]] 整块注释掉即可
#   - 凭证（雪球/股吧 cookie）**不在此配置**，走环境变量，见 AGENTS.md
# ==============================================================================

[settings]
# 默认历史月线时间跨度（月）：120 为 10 年全景，60 为 5 年，36 为 3 年
default_months = 120
# 交互式网页输出文件名
output_html = "output/sector_etf_trend.html"
# 网络请求超时时间（秒）
http_timeout = 8

[data_source]
# 取数优先级：Facade 层查询数据时先打哪一边，命中策略由本段决定。
#   local_first  = 先查本地 DuckDB，本地没有再回退远端接口，并把远端结果回写本地
#                  适用：历史分析、批量回补、可容忍数据新鲜度差异的场景
#   remote_first = 先取远端接口，远端失败再回退本地库
#                  适用：实时行情、最新估值快照等对新鲜度敏感的场景
# 合法取值仅上述两个；缺失或非法时回退为 local_first
priority = "local_first"

[benchmark]
# A 股主板基准（白色粗线呈现，作为收益分水岭）
code = "sh000001"
name = "上证指数"
sector = "A股主板基准"
color = "#ffffff"
linewidth = 3.2
linestyle = "-"
tracking_index = "上证综合指数"
fund_manager = "上海证券交易所"
purity_reason = "A 股历史最悠久、全市场覆盖最广的主板核心大盘基准"

# 备选大盘宽基（如需切换为沪深 300，注释上方 [benchmark] 各键、启用下面几行即可）
# code = "sh510300"
# name = "沪深300ETF"
# sector = "大盘核心资产"
# color = "#ffffff"
# linewidth = 3.2
# linestyle = "-"
# tracking_index = "沪深300指数"
# fund_manager = "华泰柏瑞基金"
# purity_reason = "A股核心大盘蓝筹资产基准"

# ==============================================================================
# 板块 ETF 监控清单（A 股核心板块纯正行业代表，已全量覆盖各核心产业赛道）
# 每个 [[sectors]] 块 = 一个标的，字段：
#   code           交易所前缀代码（sh/sz + 6 位）
#   name           简称
#   sector         细分赛道（省略时取 name）
#   color          折线颜色（省略/留空时按内置调色板轮转分配）
#   tracking_index 跟踪指数（可省）
#   fund_manager   基金管理人（可省）
#   purity_reason  纯度论证依据（可省）
# ==============================================================================

