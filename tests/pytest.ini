[pytest]
# StockLab 测试配置
# ---------------------------------------------------------------------------
# 迁移前 tests/ 是「纯 assert 脚本」，靠每个文件底部的 main() 顺序调用；
# 迁移到 pytest 后，最大变化不是断言写法（裸 assert 原样保留），而是：
#   1. 每个 run_xxx_test() 变成独立用例 —— 以前一处失败，后面 15 个阶段
#      全部不跑；现在失败即定位，且能单独重跑。
#   2. 临时 DuckDB 的 mkdtemp + try/finally rmtree 样板收进 conftest 的
#      tmp_db_path / fresh_db fixture（原先 5 个文件各写一遍）。
#   3. 成片的手写 for 循环参数校验改成 @pytest.mark.parametrize。
# ---------------------------------------------------------------------------

# 让 tests/ 下的文件能直接 import stocklab / app，无需每个文件改 sys.path
pythonpath = .

testpaths = tests

# -ra : 汇总末尾打印失败/跳过/告警摘要
# --strict-markers : 未注册的 marker 直接报错，防止拼错后静默失效
# --durations=15 : 打印最慢的 15 个用例，用于判断并行是否值得
# -m "not integration" : 默认排除联网/真实库测试，离线单测秒级跑完
#   跑集成测试请显式：pytest -m integration
# Coverage: 默认不强制门槛（单文件跑会误报）；全量跑时手动加 --cov-fail-under=85
# 如需临时关闭：pytest --no-cov
addopts =
    -ra --strict-markers --durations=15 -m "not integration"
    --cov=stocklab --cov=app
    --cov-report=term-missing
    --cov-branch

markers =
    integration: 依赖真实外部数据源（网络）或真实本地库的用例。
                  默认**不执行**（被 -m "not integration" 排除）；
                  显式跑：pytest -m integration
    real_db: 需要 data/stocklab.duckdb 的真实数据。DuckDB 同文件只允许
              一个写连接，若 serve_web.py 正在运行，本用例会给出明确报错
              而不是抛一句看不懂的 Could not set lock。

filterwarnings =
    error::SyntaxWarning
    # py_mini_racer（akshare 的传递依赖）在 Python 3.19 前会告警，
    # 与本项目无关，转成默认展示，避免淹没真正的告警
    ignore::DeprecationWarning:py_mini_racer.*