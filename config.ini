broker = sh512880, 证券ETF, 券商金融, #ff7f00, 全指证券公司, 国泰基金, 市场牛市旗手，高贝塔弹性代表

; 稳健高股息：工商银行、农业银行、中国银行、建设银行、招商银行等
bank = sh512800, 银行ETF, 银行高股息, #636363, 中证银行指数, 华宝基金, 高股息防御赛道代表，纯商业银行

; 公用事业绿电：长江电力、中国核电、三峡能源等清洁水电与核电电网
