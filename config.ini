; ==============================================================================
; StockLab - 核心配置文件 (config.ini)
; 可直接在此处自由修改参数、增删板块或使用 # / ; 临时注释停用任意标的
; ==============================================================================

[settings]
; 默认历史月线时间跨度（月）：120 为 10 年全景，60 为 5 年，36 为 3 年
default_months = 120
; 交互式网页输出文件名
output_html = output/sector_etf_trend.html
; 网络请求超时时间（秒）
http_timeout = 8

[data_source]
; 取数优先级：Facade 层查询数据时先打哪一边，命中策略由本段决定
;   local_first  = 先查本地 DuckDB，本地没有再回退远端接口，并把远端结果回写本地
;                  适用：历史分析、批量回补、可容忍数据新鲜度差异的场景
;   remote_first = 先取远端接口，远端失败再回退本地库
;                  适用：实时行情、最新估值快照等对新鲜度敏感的场景
; 合法取值仅上述两个；缺失或非法时回退为 local_first
priority = local_first

[benchmark]
; A 股主板基准配置 (白色粗线呈现，作为收益分水岭)
code = sh000001
name = 上证指数
sector = A股主板基准
color = #ffffff
linewidth = 3.2
linestyle = -
tracking_index = 上证综合指数
fund_manager = 上海证券交易所
purity_reason = A 股历史最悠久、全市场覆盖最广的主板核心大盘基准

; 备选大盘宽基（如需切换为沪深 300，取消下方注释并注释上方即可）
; code = sh510300
; name = 沪深300ETF
; sector = 大盘核心资产
; color = #ffffff
; linewidth = 3.2
; linestyle = -
; tracking_index = 沪深300指数
; fund_manager = 华泰柏瑞基金
; purity_reason = A股核心大盘蓝筹资产基准

[sectors]
; ==============================================================================
; A 股核心板块纯正行业代表 ETF 监控清单（已全量覆盖各核心产业赛道）
; 格式: 标识名 = 代码, 简称, 细分赛道, 折线颜色, 跟踪指数, 基金管理人, 纯度论证依据
; 【灵活配置技巧】：若暂时不想观察某个板块，直接在该行最前面加 # 或 ; 注释即可！
; ==============================================================================

; --- 【1. 大基建、周期与基础工业】 ---
; 大基建央企：纯正八大建筑央企龙头（中国建筑、中国中铁、中国铁建、中国交建、中国电建等）
infrastructure = sh516970, 基建50ETF, 基础建设, #795548, 中证基建工程, 广发基金, 纯正八大建筑央企龙头（中国建筑、中铁、铁建等）

; 周期地产：纯正保利、万科、招商蛇口等住宅商业开发商，不含泛建材家电
realestate = sh512200, 房地产ETF, 房地产, #8c564b, 中证全指房地产, 南方基金, 纯正住宅与商业开发商

; 传统能源周期：中国神华、陕西煤业、兖矿能源等动力煤与焦煤开采龙头
coal = sh515220, 煤炭ETF, 煤炭周期, #a65628, 中证煤炭指数, 国泰基金, 传统能源高股息与煤炭开采代表

; 有色金属：紫金矿业、洛阳钼业、中国铝业、北方稀土等工业金属与战略资源
metals = sh512400, 有色金属ETF, 有色金属, #b8860b, 中证申万有色, 南方基金, 紫金矿业、洛阳钼业等工业金属与稀土龙头

; 钢铁工业：宝钢股份、华菱钢铁等特钢与普钢冶炼龙头
steel = sh515210, 钢铁ETF, 钢铁工业, #708090, 中证钢铁指数, 国泰基金, 普钢与特种钢材冶炼制造龙头

; 基础化工材料：万华化学、华鲁恒升等基础与精细化工材料研发龙头
chemicals = sh516020, 化工ETF, 基础化工, #20b2aa, 中证细分化工, 华宝基金, 万华化学等基础与精细化工材料龙头


; --- 【2. 硬科技与 TMT 数字经济】 ---
; 半导体芯片：100% 聚焦北方华创、中芯国际、中微公司等芯片设计/设备/制造龙头
semiconductor = sh512480, 半导体ETF, 半导体芯片, #e41a1c, 中证全指半导体, 国联安基金, 100%聚焦芯片制造/材料/设备龙头

; 5G 通信与算力：中际旭创、新易盛、中兴通讯等光模块算力底座与通信设备
telecom = sh515050, 5G通信ETF, 通信设备, #00bfff, 中证5G通信, 华夏基金, 光模块算力底座与核心通信设备龙头

; 计算机与软件信创：金山办公、科大讯飞、海康威视等工业软件与人工智能应用
computer = sh512720, 计算机ETF, 软件信创, #4169e1, 中证计算机, 国泰基金, 基础软件、工业软件与人工智能龙头

; 传媒互动娱乐：三七互娱、世纪华通、恺英网络等游戏研发与互动传媒
gaming = sh515170, 游戏ETF, 传媒游戏, #ff1493, 中证动漫游戏, 华夏基金, 游戏研发发行与数字互动娱乐代表


; --- 【3. 高端制造与绿色新能源】 ---
; 智能新能源车：宁德时代、比亚迪、亿纬锂能等电池锂电与智能整车
ev = sh515030, 新能源车ETF, 智能电动车, #00ced1, 中证新能源汽车, 华夏基金, 电池锂电材料与智能整车产业链龙头

; 新能源低碳：专注阳光电源、隆基绿能、通威股份等硅料/组件/逆变器纯正龙头
solar = sh515790, 光伏ETF, 新能源光伏, #2ca02c, 中证光伏产业, 华泰柏瑞基金, 纯光伏逆变器/组件/硅料

