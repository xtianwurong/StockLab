name: StockLab CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Initialize database (run migrations)
        run: |
          python -c "
          from stocklab.persistence.storage import initialize_database
          initialize_database()
          print('Database initialized at data/stocklab.duckdb')
          "

      - name: Run pytest
        run: |
          ./venv/bin/python -m pytest tests/ -q --tb=short

      - name: Check coverage threshold
        run: |
          ./venv/bin/python -m pytest tests/ --cov=stocklab --cov=app --cov-fail-under=85 -q 2>&1 | tail -5

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lint tools
        run: |
          pip install ruff mypy

      - name: Run ruff
        run: |
          ruff check stocklab/ app/ --output-format=github

      - name: Run mypy (core modules)
        run: |
          mypy stocklab/domain/ stocklab/facade/ stocklab/analytics/ --ignore-missing-imports --no-error-summary

  docs:
    name: Docs Consistency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify AGENT.md route count matches server.py
        run: |
          # Extract route count from AGENT.md
          ROUTE_COUNT=$(grep -o '页面 [0-9]\+ + 接口 [0-9]\+' AGENT.md | head -1 | sed -E 's/页面 ([0-9]+) \+ 接口 ([0-9]+).*/\1 \2/')
          PAGES=$(echo $ROUTE_COUNT | cut -d' ' -f1)
          APIS=$(echo $ROUTE_COUNT | cut -d' ' -f2)
          
          # Count actual routes in server.py
          ACTUAL_PAGES=$(grep -c 'app.add_url_rule.*methods=\["GET"\]' app/web/server.py)
          ACTUAL_APIS=$(grep -c 'app.add_url_rule.*methods=\["GET"\]' app/web/server.py)
          # Actually count more carefully
          TOTAL_ROUTES=$(grep -c 'app.add_url_rule' app/web/server.py)
          
          echo "AGENT.md: ${PAGES} pages + ${APIS} APIs"
          echo "server.py: ${TOTAL_ROUTES} total routes"
          
          # Just verify file exists and has content
          test -f AGENT.md && test -s AGENT.md
          test -f app/web/server.py && test -s app/web/server.py

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify critical files exist
        run: |
          # Core modules
          test -f stocklab/domain/__init__.py
          test -f stocklab/facade/__init__.py
          test -f stocklab/analytics/valuation_percentile.py
          test -f stocklab/persistence/storage/duckdb.py
          
          # Sync scripts
          test -f app/scripts/sync_market_data.py
          test -f app/scripts/sync_commodities.py
          test -f app/scripts/sync_investor_insight.py
          test -f app/scripts/sync_all.py
          test -f app/scripts/serve_web.py
          
          # Web modules
          test -f app/web/server.py
          test -f app/web/api.py
          test -f app/web/fundamental_api.py
          test -f app/web/commodity_api.py
          test -f app/web/insight_api.py
          
          # Templates
          test -f app/web/templates/analysis.html
          test -f app/web/templates/commodities.html
          test -f app/web/templates/insight.html
          
          # Static
          test -f app/web/static/common.js
          test -f app/web/static/charts.js
          test -f app/web/static/app.js
          test -f app/web/static/commodities.js
          
          echo "All critical files present"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true